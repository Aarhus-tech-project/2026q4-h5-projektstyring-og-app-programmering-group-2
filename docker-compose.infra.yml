# Infra only: Postgres plus the observability stack, no backend. Use this while running the
# server with `dotnet run`. Needs a .env next to this file (see .env.example).
#
#   docker compose -f docker-compose.infra.yml up

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki-config
        target: /etc/loki/loki.yaml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    user: "0"
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"   # tempo query api
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
    volumes:
      - tempo-data:/var/tempo
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?see .env.example}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana-dashboard
        target: /etc/grafana/dashboards/fotolo-overview.json
      - source: grafana-dashboard-logs-traces
        target: /etc/grafana/dashboards/fotolo-logs-traces.json
      - source: grafana-dashboard-product
        target: /etc/grafana/dashboards/fotolo-product.json
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped

configs:
  loki-config:
    file: ./swarm/loki.yaml

  tempo-config:
    file: ./swarm/tempo.yaml

  grafana-datasources:
    file: ./swarm/grafana-datasources.yaml

  grafana-dashboards:
    file: ./swarm/grafana-dashboards.yaml

  grafana-dashboard:
    file: ./swarm/grafana-dashboard.json

  grafana-dashboard-logs-traces:
    file: ./swarm/grafana-dashboard-logs-traces.json

  grafana-dashboard-product:
    file: ./swarm/grafana-dashboard-product.json

volumes:
  postgres18-data:
  loki-data:
  prometheus-data:
  grafana-data:
  tempo-data: