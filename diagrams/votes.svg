<text x="48.0" y="46.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="central" >Fotolo · votes and Elo</text>
<text x="48.0" y="76.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#64748b" text-anchor="start" dominant-baseline="central" >Every post has an Elo rating (new posts start at 1000). Winning a matchup takes points from the loser.</text>
<text x="48.0" y="132.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="central" >1 · How a vote gets counted</text>
