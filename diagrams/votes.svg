<text x="48.0" y="340.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="central" >2 · How much a win is worth</text>
